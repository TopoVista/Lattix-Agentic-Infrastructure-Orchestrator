apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lattix-gateway
  namespace: gateway
spec:
  tls:
    - hosts:
        - staging.lattix.example.com
      secretName: lattix-gateway-staging-tls
  rules:
    - host: staging.lattix.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lattix-tools
  namespace: tools
spec:
  tls:
    - hosts:
        - tools.staging.lattix.example.com
      secretName: lattix-tools-staging-tls
  rules:
    - host: tools.staging.lattix.example.com
