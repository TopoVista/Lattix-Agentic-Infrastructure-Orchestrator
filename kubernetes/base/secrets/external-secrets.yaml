apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-gateway-secrets
  namespace: gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lattix-secrets
  target:
    name: api-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: lattix/dev/platform
        property: gateway.databaseUrl
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: lattix/dev/platform
        property: gateway.jwtSigningKey
