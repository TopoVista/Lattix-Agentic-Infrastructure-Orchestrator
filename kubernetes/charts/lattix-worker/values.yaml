    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
nodeSelector: {}
tolerations: []
affinity: {}
env: {}
secrets: {}
