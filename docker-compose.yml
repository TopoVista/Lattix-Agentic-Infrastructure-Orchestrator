name: lattix

networks:
  lattix:
    name: lattix-local

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  neo4j-data:
  qdrant-data:
  clickhouse-data:
  opensearch-data:
  grafana-data:

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "data"]
    environment:
      POSTGRES_DB: lattix
      POSTGRES_USER: lattix
      POSTGRES_PASSWORD: lattix_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattix -d lattix"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lattix

  redis:
    image: redis:7-alpine
    profiles: ["core", "cache"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lattix

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["core", "messaging"]
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - lattix

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: ["core", "object-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lattix
      MINIO_ROOT_PASSWORD: lattix_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lattix

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    profiles: ["core", "object-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set lattix http://minio:9000 lattix lattix_local_password
        mc mb --ignore-existing lattix/lattix-repository-snapshots
        mc mb --ignore-existing lattix/lattix-documents
        mc mb --ignore-existing lattix/lattix-artifacts
        mc mb --ignore-existing lattix/lattix-model-artifacts
        mc mb --ignore-existing lattix/lattix-audit-exports
        mc mb --ignore-existing lattix/lattix-backups
    networks:
      - lattix

  neo4j:
    image: neo4j:5-community
    profiles: ["graph", "data"]
    environment:
      NEO4J_AUTH: neo4j/lattix_local_password
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - lattix

  qdrant:
    image: qdrant/qdrant:v1.12.1
    profiles: ["vector", "ai", "data"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lattix

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    profiles: ["analytics", "data"]
    environment:
      CLICKHOUSE_DB: lattix
      CLICKHOUSE_USER: lattix
      CLICKHOUSE_PASSWORD: lattix_local_password
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lattix

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: ["search", "data"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks:
      - lattix

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/collector/local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    networks:
      - lattix

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - lattix

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lattix_local_password
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - lattix
