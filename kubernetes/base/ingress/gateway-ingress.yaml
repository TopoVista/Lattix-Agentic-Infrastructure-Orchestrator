apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lattix-gateway
  namespace: gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
    - hosts:
        - { { .Values.ingress.host | default("lattix.example.com") } }
      secretName: lattix-tls
  rules:
    - host: { { .Values.ingress.host | default("lattix.example.com") } }
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: gateway-http
                port:
                  number: 80
