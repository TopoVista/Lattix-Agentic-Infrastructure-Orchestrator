name: Infrastructure

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --profile core --profile data --profile observability config

  terraform-format:
    name: Terraform formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [local, dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize without remote state
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false
      - name: Validate environment
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  terraform-security:
    name: Terraform security policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yml

  terraform-lint:
    name: Terraform lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive --config .tflint.hcl

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yamllint
      - run: yamllint .github cloud docker-compose.yml .pre-commit-config.yaml
