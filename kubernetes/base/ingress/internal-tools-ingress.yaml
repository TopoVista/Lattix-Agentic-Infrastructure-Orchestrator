apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lattix-tools
  namespace: tools
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - tools.lattix.local
      secretName: lattix-tools-tls
  rules:
    - host: tools.lattix.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-tools
                port:
                  number: 8080
