replicaCount: 1
image:
  repository: lattix/service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  host: lattix.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
livenessProbe:
  enabled: true
  path: /healthz
  port: 8080
readinessProbe:
  enabled: true
  path: /ready
  port: 8080
nodeSelector: {}
tolerations: []
affinity: {}
env: {}
secrets: {}
serviceMonitor:
  enabled: false
  namespace: observability
  interval: 30s
  scrapeTimeout: 10s
