replicaCount: 1
image:
  repository: lattix/auth-service
  tag: local
ingress:
  enabled: true
  host: auth.lattix.local
  tls:
    enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
autoscaling:
  enabled: false
networkPolicy:
  ingressNamespaces:
    - gateway
